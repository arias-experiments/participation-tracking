services:
  frontend:
    build: ./frontend
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-participation}
      DB_USER: ${DB_USER:-participation_user}
      DB_PASSWORD: ${DB_PASSWORD:-participation_password}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-participation}
      POSTGRES_USER: ${DB_USER:-participation_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-participation_password}
    volumes:
      - participation_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  participation_data:
  frontend_node_modules:
  backend_node_modules:
